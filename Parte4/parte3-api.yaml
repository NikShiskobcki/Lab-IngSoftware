openapi: 3.0.3

info:
  title: API de Gestión de Turnos y Reservas - TaPronto
  description: API REST para la gestión de establecimientos, personal y reservas de turnos.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

paths:
  # API de reservas
  /reservas:
    post:
      tags:
        - Reservas
      summary: Generar nueva reserva
      description: Publica la solicitud al broker MQTT Mosquitto para su validación y persistencia.
      operationId: generarReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearReservaDTO'
      responses:
        '201':
          description: Solicitud enviada correctamente a procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGenerarReserva'
        '400':
          description: Datos inválidos en la solicitud

    get:
      tags:
        - Reservas
      summary: Listar reservas
      description: Retorna todas las reservas o las filtra por personal.
      operationId: listarReservas
      parameters:
        - name: idPersonal
          in: query
          required: false
          description: Identificador opcional del personal
          schema:
            type: integer
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'

  /reservas/{id}:
    get:
      tags:
        - Reservas
      summary: Consultar reserva por ID
      operationId: buscarReservaPorId
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: Reserva no encontrada

    delete:
      tags:
        - Reservas
      summary: Eliminar reserva
      operationId: eliminarReserva
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Reserva eliminada correctamente
        '404':
          description: Reserva no encontrada

  # API de establecimientos
  /establecimientos:
    get:
      tags:
        - Establecimientos
      summary: Listar establecimientos
      description: Retorna todos los establecimientos registrados.
      operationId: listarEstablecimientos
      responses:
        '200':
          description: Listado obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Establecimiento'

    post:
      tags:
        - Establecimientos
      summary: Crear establecimiento
      description: Registra un nuevo establecimiento.
      operationId: crearEstablecimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecimientoInput'
      responses:
        '201':
          description: Establecimiento creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establecimiento'
        '400':
          description: Datos inválidos en la solicitud

  /establecimientos/{id}:
    get:
      tags:
        - Establecimientos
      summary: Obtener establecimiento por ID
      operationId: obtenerEstablecimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Establecimiento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establecimiento'
        '404':
          description: Establecimiento no encontrado

    put:
      tags:
        - Establecimientos
      summary: Actualizar establecimiento
      description: Actualiza todos los datos de un establecimiento existente.
      operationId: actualizarEstablecimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecimientoInput'
      responses:
        '200':
          description: Establecimiento actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Establecimiento'
        '400':
          description: Datos inválidos en la solicitud
        '404':
          description: Establecimiento no encontrado

    delete:
      tags:
        - Establecimientos
      summary: Eliminar establecimiento
      operationId: eliminarEstablecimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Establecimiento eliminado correctamente
        '404':
          description: Establecimiento no encontrado

  # API de personal
  /personal:
    get:
      tags:
        - Personal
      summary: Listar personal
      description: Retorna todos los miembros del personal registrados.
      operationId: listarPersonal
      responses:
        '200':
          description: Listado obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Personal'

    post:
      tags:
        - Personal
      summary: Crear personal
      description: Registra un nuevo miembro del personal en un establecimiento.
      operationId: crearPersonal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInput'
      responses:
        '201':
          description: Personal creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personal'
        '400':
          description: Datos inválidos o establecimiento inexistente

  /personal/{id}:
    get:
      tags:
        - Personal
      summary: Obtener personal por ID
      operationId: obtenerPersonal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Personal encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personal'
        '404':
          description: Personal no encontrado

    put:
      tags:
        - Personal
      summary: Actualizar personal
      description: Actualiza los datos y el estado de un miembro del personal.
      operationId: actualizarPersonal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalInput'
      responses:
        '200':
          description: Personal actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personal'
        '400':
          description: Datos inválidos o establecimiento inexistente
        '404':
          description: Personal no encontrado

    delete:
      tags:
        - Personal
      summary: Eliminar personal
      operationId: eliminarPersonal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Personal eliminado correctamente
        '404':
          description: Personal no encontrado

  /personal/{id}/agenda:
    get:
      tags:
        - Personal
      summary: Consultar agenda de un empleado
      description: Retorna los turnos asignados al empleado en una fecha determinada, ordenados por hora.
      operationId: consultarAgenda
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FechaQuery'
      responses:
        '200':
          description: Agenda consultada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaResponse'
        '400':
          description: La fecha o los parámetros enviados son inválidos
        '404':
          description: Personal no encontrado

  /personal/{id}/disponibilidad:
    get:
      tags:
        - Personal
      summary: Consultar disponibilidad de un empleado
      description: Retorna los horarios disponibles del empleado dentro del horario del establecimiento.
      operationId: consultarDisponibilidad
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/FechaQuery'
      responses:
        '200':
          description: Disponibilidad consultada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          description: La fecha o los parámetros enviados son inválidos
        '404':
          description: Personal o establecimiento no encontrado

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador del recurso
      schema:
        type: integer
        format: int64
        example: 1

    FechaQuery:
      name: fecha
      in: query
      required: true
      description: Fecha de la consulta en formato AAAA-MM-DD
      schema:
        type: string
        format: date
        example: '2026-10-15'

  schemas:
    CrearReservaDTO:
      type: object
      required:
        - idPersonal
        - emailCliente
        - telefonoCliente
        - fecha
        - hora
      properties:
        idPersonal:
          type: integer
          example: 1
        emailCliente:
          type: string
          format: email
          example: cliente@correo.com
        telefonoCliente:
          type: string
          example: '099123456'
        fecha:
          type: string
          format: date
          example: '2026-10-15'
        hora:
          type: string
          example: '10:00'

    Reserva:
      type: object
      properties:
        id:
          type: integer
          example: 1
        idPersonal:
          type: integer
          example: 1
        emailSolicitante:
          type: string
          format: email
          example: cliente@correo.com
        telefonoSolicitante:
          type: string
          example: '099123456'
        fechaTurno:
          type: string
          format: date
          example: '2026-10-15'
        horaTurno:
          type: string
          example: '10:00:00'
        duracionMinutos:
          type: integer
          example: 30
        fechaRegistro:
          type: string
          format: date-time
          example: '2026-10-15T10:00:00-03:00'
        estado:
          type: string
          example: CONFIRMADO

    RespuestaGenerarReserva:
      type: object
      properties:
        status:
          type: string
          example: SOLICITUD_ENVIADA
        mensaje:
          type: string
          example: Reserva enviada a Mosquitto para ser validada y persistida
        datos:
          $ref: '#/components/schemas/CrearReservaDTO'

    EstablecimientoInput:
      type: object
      required:
        - nombreComercial
        - direccion
        - telefono
        - correoElectronico
        - horarioApertura
        - horarioCierre
      properties:
        nombreComercial:
          type: string
          example: Clínica TaPronto Centro
        direccion:
          type: string
          example: Avenida 18 de Julio 1234
        telefono:
          type: string
          example: '29001234'
        correoElectronico:
          type: string
          format: email
          example: centro@tapronto.com
        horarioApertura:
          type: string
          example: '08:00:00'
        horarioCierre:
          type: string
          example: '18:00:00'

    Establecimiento:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/EstablecimientoInput'

    PersonalInput:
      type: object
      required:
        - idEstablecimiento
        - nombre
        - especialidad
        - costoConsulta
        - duracionEstandarMinutos
      properties:
        idEstablecimiento:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Ana Rodríguez
        especialidad:
          type: string
          example: Medicina general
        costoConsulta:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          example: 1500.00
        duracionEstandarMinutos:
          type: integer
          minimum: 1
          example: 30
        estado:
          $ref: '#/components/schemas/EstadoPersonal'

    Personal:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/PersonalInput'

    EstadoPersonal:
      type: string
      description: Estado actual del miembro del personal
      enum:
        - ACTIVO
        - INACTIVO
      default: ACTIVO
      example: ACTIVO

    AgendaResponse:
      type: object
      required:
        - idPersonal
        - nombrePersonal
        - fecha
        - turnos
      properties:
        idPersonal:
          type: integer
          format: int64
          example: 1
        nombrePersonal:
          type: string
          example: Ana Rodríguez
        fecha:
          type: string
          format: date
          example: '2026-10-15'
        turnos:
          type: array
          items:
            $ref: '#/components/schemas/TurnoAgendaResponse'

    TurnoAgendaResponse:
      type: object
      required:
        - idReserva
        - hora
        - duracionMinutos
        - estado
        - emailSolicitante
        - telefonoSolicitante
      properties:
        idReserva:
          type: integer
          example: 10
        hora:
          type: string
          example: '10:00:00'
        duracionMinutos:
          type: integer
          example: 30
        estado:
          type: string
          example: CONFIRMADO
        emailSolicitante:
          type: string
          format: email
          example: cliente@correo.com
        telefonoSolicitante:
          type: string
          example: '099123456'

    DisponibilidadResponse:
      type: object
      required:
        - idPersonal
        - nombrePersonal
        - fecha
        - duracionTurnoMinutos
        - horariosDisponibles
      properties:
        idPersonal:
          type: integer
          format: int64
          example: 1
        nombrePersonal:
          type: string
          example: Ana Rodríguez
        fecha:
          type: string
          format: date
          example: '2026-10-15'
        duracionTurnoMinutos:
          type: integer
          example: 30
        horariosDisponibles:
          type: array
          description: Horarios libres dentro del horario del establecimiento
          items:
            type: string
            example: '09:30:00'
          example:
            - '08:00:00'
            - '08:30:00'
            - '09:30:00'